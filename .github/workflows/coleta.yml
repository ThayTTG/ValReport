# Coleta na nuvem (no lugar da tarefa do PC). Roda de três jeitos:
#   - quando alguém da equipe abre o site e os dados têm mais de 15 minutos (v24; o site chama pela API do GitHub,
#     e o banco segura o ritmo: no máximo uma a cada 15 minutos);
#   - quando a administradora pede algo no Sync do site, ou pelo botão "Run workflow";
#   - pelo agendamento abaixo, que fica como reserva: o GitHub pula a maior parte dos horários (de 08/11 a 13/11
#     foram 24 execuções no lugar de ~350).
# Só roda com a variável do repositório VALREPORT_NUVEM = ligada (Settings > Secrets and variables > Actions > Variables).
# O log é público (repositório público): o script imprime só contagens; os detalhes ficam no log privado da nuvem.
name: Coleta

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      motivo:
        description: "Por que rodar agora"
        required: false
        default: "manual"

permissions:
  contents: read
  actions: write   # para renovar os agendamentos (o GitHub desliga depois de 60 dias sem atividade)

concurrency:
  group: coleta    # uma execução por vez (coleta e report dividem a mesma pasta dados)
  cancel-in-progress: false

jobs:
  coleta:
    if: vars.VALREPORT_NUVEM == 'ligada'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      PYTHONUTF8: "1"
      HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DISCORD_WEBHOOK_EQUIPE: ${{ secrets.DISCORD_WEBHOOK_EQUIPE }}
      DISCORD_WEBHOOK_JOGADORES: ${{ secrets.DISCORD_WEBHOOK_JOGADORES }}
      DISCORD_WEBHOOK_FORMACOES: ${{ secrets.DISCORD_WEBHOOK_FORMACOES }}
      DISCORD_WEBHOOK_DICAS: ${{ secrets.DISCORD_WEBHOOK_DICAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar o cache da pasta dados (criptografado)
        uses: actions/cache/restore@v4
        with:
          path: estado.enc
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - name: Preparar (configuração e pasta dados)
        run: python ferramentas/nuvem.py preparar --cache estado.enc
      - name: Coletar
        run: python ferramentas/nuvem.py coletar
      - name: Manter os agendamentos ligados
        run: python ferramentas/nuvem.py manter
      - name: Guardar a pasta dados
        if: always()
        run: python ferramentas/nuvem.py guardar --cache estado.enc
      - name: Salvar o cache
        if: always() && hashFiles('estado.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: estado.enc
          key: estado-${{ github.run_id }}
